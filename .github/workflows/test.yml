name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m py_compile read_legacy_dual.py reception_watch.py command_inbox.py status_payload.py
      - run: for f in *.sh; do bash -n "$f"; done
      - run: python test_is_in_scope.py
      - run: python test_reception_watch.py
      - run: python -m unittest discover -p 'test_*.py' -v
